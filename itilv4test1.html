    tip:"★ 지식 관리 = 올바른 정보를 올바른 사람에게 올바른 시간에"},

  {id:97,cat:'practice',q:"The DIKW model is associated with which ITIL 4 practice?",
    o:["Service Level Management","Incident Management","Knowledge Management","Service Configuration Management"],a:2,
    en:"The DIKW model (Data → Information → Knowledge → Wisdom) is associated with Knowledge Management. It shows how raw data transforms into wisdom.",
    ko:"DIKW 모델(데이터→정보→지식→지혜)은 지식 관리와 관련됩니다.",
    why:"C가 정답인 이유: DIKW는 Knowledge Management의 핵심 모델입니다. 데이터가 어떻게 정보, 지식, 최종적으로 지혜(건전한 판단 능력)로 변환되는지를 설명합니다.",
    tip:"★ DIKW = Data→Information→Knowledge→Wisdom → Knowledge Management"},

  {id:98,cat:'practice',q:"What is the purpose of the 'Deployment Management' practice?",
    o:["To make new services available for user consumption","To move new or changed hardware, software, or other components to live environments","To manage the lifecycle of all IT infrastructure","To assess and authorize all changes before implementation"],a:1,
    en:"Deployment Management moves components to live environments — the technical act of moving things. Separate from Release Management (making services available for use).",
    ko:"배포 관리는 구성요소를 라이브 환경으로 이동하는 기술적 행위입니다.",
    why:"B가 정답인 이유: Deployment의 핵심은 'Move to live environments(라이브 환경으로 이동)'입니다. A(사용 가능하게 만듦)는 Release Management의 목적입니다.",
    tip:"★ 배포 관리 = 컴포넌트를 라이브 환경으로 이동 (기술적 행위)"},

  {id:99,cat:'practice',q:"What is the purpose of the 'Relationship Management' practice?",
    o:["To manage technical integration between systems","To establish and nurture links between the organization and its stakeholders at strategic and tactical levels","To manage contractual agreements with external suppliers","To handle all complaints and escalations from customers"],a:1,
    en:"Relationship Management establishes and nurtures links between the organization and its stakeholders at strategic and tactical levels.",
    ko:"관계 관리는 조직과 이해관계자 간의 전략적·전술적 수준의 연결을 구축하고 육성합니다.",
    why:"B가 정답인 이유: 핵심 키워드: 'Establish and nurture(구축하고 육성)' + 'Strategic and tactical levels(전략적·전술적 수준)'. C(계약 관리)는 Supplier Management에 더 가깝습니다.",
    tip:"★ 관계 관리 = 조직-이해관계자 간 전략적·전술적 연결 구축·육성"},

  {id:100,cat:'practice',q:"ITIL 4 categorizes its 34 practices into three groups. Which CORRECTLY identifies them?",
    o:["Strategic, Tactical, and Operational practices","General Management practices, Service Management practices, and Technical Management practices","Core, Supporting, and Advanced practices","Foundation, Intermediate, and Expert practices"],a:1,
    en:"34 practices in three groups: General Management (14), Service Management (17), Technical Management (3).",
    ko:"34개 프랙티스 = 일반 관리(14) + 서비스 관리(17) + 기술 관리(3).",
    why:"B가 정답인 이유: ITIL v4의 공식 분류입니다. General Management(비즈니스에서 차용, 14개), Service Management(서비스 관리 특화, 17개), Technical Management(기술에서 차용, 3개).",
    tip:"★ 34개 프랙티스 = 일반관리(14) + 서비스관리(17) + 기술관리(3)"}
];

// ── STATE ──
let mode='quiz', cf='all', ans={};

// ── RENDER ──
function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('on',i===(m==='quiz'?0:1)));
  document.getElementById('quizV').classList.toggle('hidden',m!=='quiz');
  document.getElementById('studyV').classList.toggle('hidden',m!=='study');
  render();
}
function filt(c,el){cf=c;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');render();}
function getF(){return cf==='all'?Q:Q.filter(q=>q.cat===cf);}
function render(){mode==='quiz'?renderQuiz():renderStudy();}

const tagMap={concept:'Key Concept',dimension:'4 Dimensions',principle:'Guiding Principle',svs:'SVS',svc:'Value Chain',practice:'Practice'};

function renderQuiz(){
  const qs=getF();
  document.getElementById('quizV').innerHTML=qs.map(q=>{
    const s=ans[q.id];
    let cc='qc';if(s)cc+=s.c?' ok':' no';
    let st='';if(s)st=s.c?'✓':'✗';
    return `<div class="${cc}" id="c${q.id}">
      <div class="qh" onclick="tog(${q.id})">
        <span class="qn">Q${q.id}</span>
        <span class="tag tag-${q.cat}">${tagMap[q.cat]}</span>
        <span class="qt">${hl(q.q)}</span>
        <span class="qs">${st}</span>
      </div>
      <div class="qb" id="b${q.id}">
        <div class="opts">${q.o.map((o,i)=>{
          let oc='op';
          if(s){if(i===q.a)oc+=' rev';else if(i===s.ch&&!s.c)oc+=' wrn';else oc+=' dis';}
          return `<div class="${oc}" onclick="pick(${q.id},${i})" id="o${q.id}-${i}"><span class="opk">${'ABCD'[i]}</span><span>${hl(o)}</span></div>`;
        }).join('')}</div>
        ${s?expHTML(q,s):''}
      </div>
    </div>`;
  }).join('');
}

function expHTML(q,s){
  const ok=s.c;
  return `<div class="exp show ${ok?'cexp':'wexp'}">
    <div class="exp-r ${ok?'c':'w'}">${ok?'✓ Correct!':'✗ Incorrect — Answer: '+('ABCD'[q.a])}</div>
    <div class="exp-lbl">Explanation (EN)</div>
    <div class="exp-en">${q.en}</div>
    <div class="exp-ko">🇰🇷 ${q.ko}</div>
    <div class="exp-why"><div class="why-title">왜 이 답인가?</div><div class="why-body">${q.why}</div></div>
    ${q.tip?`<div class="exp-tip">${q.tip}</div>`:''}
  </div>`;
}

function tog(id){const b=document.getElementById('b'+id);b.classList.toggle('open');}

function pick(qid,ch){
  if(ans[qid])return;
  const q=Q.find(x=>x.id===qid);
  const ok=ch===q.a;
  ans[qid]={ch,c:ok};
  q.o.forEach((_,i)=>{
    const el=document.getElementById('o'+qid+'-'+i);
    el.onclick=null;
    if(i===q.a)el.className='op rev';
    else if(i===ch&&!ok)el.className='op wrn';
    else el.className='op dis';
  });
  const b=document.getElementById('b'+qid);
  b.insertAdjacentHTML('beforeend',expHTML(q,ans[qid]));
  const card=document.getElementById('c'+qid);
  card.className='qc '+(ok?'ok':'no');
  card.querySelector('.qs').textContent=ok?'✓':'✗';
  updSt();
}

function renderStudy(){
  const qs=getF();
  document.getElementById('studyV').innerHTML=qs.map(q=>`<div class="sc">
    <div class="s-head">
      <span class="qn">Q${q.id}</span>
      <span class="tag tag-${q.cat}">${tagMap[q.cat]}</span>
      <span class="qt">${hl(q.q)}</span>
    </div>
    <div class="s-body">
      <div class="s-opts">${q.o.map((o,i)=>`<div class="s-op${i===q.a?' ans':''}"><span class="opk">${'ABCD'[i]}</span><span>${hl(o)}${i===q.a?' ✓':''}</span></div>`).join('')}</div>
      <div class="s-exp">
        <div class="exp-lbl">Explanation (EN)</div>
        <div class="exp-en">${q.en}</div>
        <div class="exp-ko">🇰🇷 ${q.ko}</div>
        <div class="exp-why"><div class="why-title">왜 이 답인가?</div><div class="why-body">${q.why}</div></div>
        ${q.tip?`<div class="exp-tip">${q.tip}</div>`:''}
      </div>
    </div>
  </div>`).join('');
}

function updSt(){
  const t=Q.length,a=Object.keys(ans).length,c=Object.values(ans).filter(x=>x.c).length,w=a-c;
  document.getElementById('sT').textContent=t;
  document.getElementById('sA').textContent=a;
  document.getElementById('sC').textContent=c;
  document.getElementById('sW').textContent=w;
  const p=Math.round(a/t*100);
  document.getElementById('pB').style.width=p+'%';
  document.getElementById('pP').textContent=p+'%';
}

function resetAll(){if(!confirm('Reset all progress?'))return;ans={};updSt();render();}

renderQuiz();updSt();
</script>
</body>
</html>
